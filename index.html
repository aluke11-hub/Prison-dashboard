var activeTab = 'overview', sortKey = 'seized2024';

function fmt(n){ if(!n)return 'N/A'; if(n>=1e6)return(n/1e6).toFixed(1)+'M'; if(n>=1e3)return(n/1e3).toFixed(0)+'K'; return n.toLocaleString(); }
function badge(t,c){ return '<span class="badge" style="background:'+c+'18;color:'+c+';border:1px solid '+c+'40">'+t+'</span>'; }
function kpi(l,v,s,a){ return '<div class="kpi" style="border-color:'+a+'30"><div class="kv" style="color:'+a+'">'+v+'</div><div class="kl">'+l+'</div>'+(s?'<div class="ks">'+s+'</div>':'')+'</div>'; }
function bar(lbl,val,max,color,disp){
  var pct=max>0?Math.min(Math.round(val/max*100),100):0;
  return '<div class="brow"><div class="blbl">'+lbl+'</div><div class="btrack"><div class="bfill" style="width:'+pct+'%;background:'+color+'">'+disp+'</div></div><div class="bval">'+disp+'</div></div>';
}
function tog(id){ var el=document.getElementById(id); if(el) el.classList.toggle('open'); }

function renderOverview(){
  var n=DATA.national;
  var maxSmug = Math.max.apply(null, DATA.smuggling_methods.map(function(m){return m.pct;}));

  return '<h2 class="sec-title">National Overview</h2>'
  +'<p class="sec-sub">An estimated 500,000 contraband cell phones are in active circulation across U.S. prisons — roughly 1 in 4 inmates has access per FCC and SOC LLC estimates cited in the September 2025 NPRM. Oklahoma DOC seized 1,800+ phones in just the first months of 2026. Georgia seized 15,500 in all of 2024. Detection rates remain low, and the FCC final rule on state jamming is expected by end of 2026 — with major carrier opposition from CTIA standing in the way.</p>'
  +'<div class="card" style="border-left:3px solid #22c55e;margin-bottom:18px"><div class="ct">Breaking Developments</div><div class="g3">'
  +DATA.news.map(function(n){return '<div class="news-card" style="border-left-color:'+n.color+'"><div class="ndate">'+n.date+'</div><div class="nhead">'+n.headline+'</div><div class="nbody">'+n.body+'</div></div>';}).join('')

  +'<div class="card"><div class="ct">How Phones Are Used — Estimated Usage Split</div><div class="bchart">'

function toggleOpsCard(id){
  var body=document.getElementById('opsbody-'+id);
  var arrow=document.getElementById('opsarrow-'+id);
  var card=document.getElementById('opscard-'+id);
  if(!body) return;
  var isOpen=body.classList.contains('open');
  // close all
  document.querySelectorAll('.eb').forEach(function(e){e.classList.remove('open');});
  document.querySelectorAll('[id^="opsarrow-"]').forEach(function(a){a.textContent='▼';a.style.color='#2a2a4a';});
  if(!isOpen){
    body.classList.add('open');
    arrow.textContent='▲';
    arrow.style.color='#22c55e';
    card.style.borderColor='rgba(34,197,94,0.3)';
  } else {
    card.style.borderColor='';
  }
}

function filterOps(cat){
  activeOpsFilter=cat;
  document.querySelectorAll('[id^="ops-filter-"]').forEach(function(b){b.classList.remove('on');});
  var btnId='ops-filter-'+cat.replace(/[^a-zA-Z]/g,'');
  var btn=document.getElementById(btnId);
  if(btn) btn.classList.add('on');
  var catMap={'ALL':null,'Murder-for-Hire':'Murder','Cartel':'Transnational','Fraud':'Fraud','Trafficking':'Trafficking','Gang':'Gang','Extortion':'Extortion'};
  var kw=catMap[cat];
  document.querySelectorAll('.ops-card').forEach(function(card){
    if(!kw) { card.style.display=''; return; }
    var cardCat=card.getAttribute('data-cat')||'';
    card.style.display=cardCat.toLowerCase().indexOf(kw.toLowerCase())>=0?'':'none';
  });
}
